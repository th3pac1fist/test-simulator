name: aipvp-mcp

on:
  push:
    paths: ["aipvp-mcp/**", ".github/workflows/aipvp-mcp.yml"]
  pull_request:
    paths: ["aipvp-mcp/**", ".github/workflows/aipvp-mcp.yml"]

permissions:
  contents: read

jobs:
  python:
    name: CLI, MCP server and mock (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aipvp-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  node:
    name: Fighter Lab engine, economy, agent and optimizer (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test aipvp-mcp/apps/fighter-lab/*.test.mjs

  browser:
    name: Fighter Lab in a headless browser (fake claude.ai)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aipvp-mcp/apps/fighter-lab/tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node run.cjs
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fighter-lab-screenshots
          path: aipvp-mcp/apps/fighter-lab/tests/browser/out
